# Converted from data/config.example.json (JSON -> YAML).
# 源 JSON 暂时保留。本文件为受版本控制的配置模板。
server:
  host: 0.0.0.0
  port: 8000
  log_level: info
  request_timeout: 600.0
  # Inference concurrency gate (NOT a rate limiter): at most this many requests
  # are in flight against model backends (Ollama / LM Studio / OpenCode chat).
  # A burst is QUEUED, never rejected with 429; streaming responses hold their
  # slot until the last chunk, so this bounds simultaneous generation jobs and
  # protects local VRAM. Single-GPU hosts: 1~2. Requires a restart to change.
  max_concurrency: 4
  # Max seconds a request waits for a free slot; beyond that it gets 503 +
  # Retry-After. Bounds the waiting queue under a sustained flood.
  # Control-plane traffic (System One, web search, probes) is NOT gated.
  upstream_queue_timeout: 120.0
  upstream_keepalive_expiry: 30.0
security:
  # ------------------------------------------------------------------ #
  # Zone A: the trusted LAN listener on server.port (8000 by default).
  # The kernel-assigned local socket is the trust anchor: no IP whitelist and
  # no X-Forwarded-For setting can move a request into or out of this zone.
  internal:
    # true  = normal APIs are key-free on THIS port only.
    # false = every business API needs a key (the liveness probes stay open).
    allow_anonymous: true
    # Whether the anonymous `/` probe reveals the exact build version.
    expose_version: false
    # Whether /docs, /openapi.json and the Swagger assets are served.
    # The public zone never serves them, whatever this says.
    expose_docs: true

  # ------------------------------------------------------------------ #
  # Zone B: the internet-facing listener.
  #   null = no public listener (internal-only instance).
  #   8001 = a second socket: internal 8000 + public 8001 in ONE process.
  #   8000 = same value as server.port -> public-only single socket, with NO
  #          anonymous HTTP path (use a TCP port check for the container probe).
  # Map the two container ports to DIFFERENT host ports; two host ports pointing
  # at one container socket do NOT create two zones.
  public:
    port: 8001
    # The COMPLETE list of what exists on the public socket. Keys are HTTP
    # methods; values are full-match regexes (re.fullmatch, not prefixes).
    # Anything not listed returns 404 before routing, WITH OR WITHOUT a key.
    # There is no code-level hidden-path list and no `require_api_key` toggle:
    # this mapping is the only positive allowlist.
    # The management API (/v1/management/*) and /admin are always 404 here.
    # Listing a path does not invent one: it must also be a gateway API that
    # app/proxy.py is willing to forward (see docs/CONFIG.md -> path surface),
    # otherwise the proxy answers 404 "not part of this gateway's API".
    # Listing a path never makes it anonymous either. app/bridge.py answers two
    # separate questions in the middleware: bridge_denial() = does this
    # method+path exist here (404 if not), public_auth_denial() = may this
    # caller use it (401 without a key or console session, 403 for an invalid
    # key). The second one belongs to the zone, not to the route, so it cannot
    # be waived from config and is checked after the rate limiter.
    # Browser (cross-origin) clients need OPTIONS mirrored here: the preflight
    # carries no key and is answered before the credential check, but an
    # unlisted method+path is still a 404, so add
    #   OPTIONS:
    #   - ^/v1/chat/completions$
    # for every path a web page calls on this socket.
    path_allowlist:
      GET:
      - ^/v1/models$
      POST:
      - ^/v1/chat/completions$
      - ^/v1/messages$
      - ^/api/generate$
      - ^/api/chat$
    # Ollama model management on the PUBLIC listener only:
    #   deny     = block pull/push/create/delete/copy/blobs (default)
    #   readonly = still allow `pull`, block the rest
    #   allow    = forward every admin call, api/blobs/* included
    # The internal listener never applies this - pulling a model on the trusted
    # LAN is a normal operation, so changing this value there does nothing.
    # This mode NEVER opens a path on its own: path_allowlist is checked first,
    # so exposing `pull` publicly needs BOTH a mode that allows it AND an entry,
    # e.g. admin_endpoints: readonly plus POST: [^/api/pull$] above. Without the
    # entry the 404 comes from the allowlist and looks like "allow has no effect".
    admin_endpoints: deny

  # ------------------------------------------------------------------ #
  # Hardening shared by BOTH zones.
  blocked_paths: []
  # TCP-level deny-list (bare IP or CIDR, IPv4/IPv6): a matching client gets its
  # socket aborted in uvicorn's connection_made, BEFORE ASGI sees a single byte.
  # There is NO HTTP response (not even 444), NO access log and NO request log
  # row -- only one `deny <ip>` application log line. This is not a rate limit:
  # it is a hard block on the real TCP peer (X-Forwarded-* is never consulted).
  #   - empty  = no connection is dropped
  #   - IP     = one host, e.g. 203.0.113.7 or 2001:db8::1
  #   - CIDR   = a whole range, e.g. 10.0.0.0/8 or 2001:db8::/32
  # Invalid entries are skipped with a warning; a typo never stops startup.
  # Hot-reloads (within ~1s, even on an idle gateway). Enforcement REQUIRES the
  # custom uvicorn protocol: serve.py injects it, and the CLI/local launcher
  # passes `--http ip_guard_protocol:GuardProtocol`. Startup logs a warning if
  # this list is non-empty but the protocol was not installed.
  blocked_ips: []
  # Exact origins allowed cross-site; empty sends no CORS headers at all. A
  # preflight is answered with a bodyless 204 BEFORE the public key check (it
  # carries no credentials), but OPTIONS is still a method+path for the
  # allowlist: a browser calling the PUBLIC port needs an OPTIONS: entry there,
  # or the preflight is a 404 and the real request never leaves the page.
  cors_origins: []
  max_body_bytes: 33554432
  # Caller keys are accepted from headers only (Authorization / X-API-Key).
  # X-Forwarded-* / X-Real-IP are never trusted: rate-limit buckets and audit
  # rows always use the real TCP peer. Behind nginx all traffic shares one IP,
  # so prefer `rate_limit.by: key` there (or rate-limit at nginx itself).
  rate_limit:
    # Turn this on for any internet-facing instance (or rate-limit at the proxy).
    # The console sign-in has its own lockout, but other endpoints are unthrottled.
    enabled: false
    per_minute: 60
    burst: 20
    by: ip
# Caller authentication is configured under `security`, NOT under a top-level
# `auth` node. Trust zones are decided by the listening socket:
#   server.port              -> internal (trusted LAN)
#   security.public.port     -> public (internet-facing), if configured
# No IP whitelist or X-Forwarded-For header can move a request between zones.
# strict: true refuses to guess an upstream for an unknown *named* model (404 instead
# of forwarding it). A request whose body carries no `model` at all - a GET, or an Ollama
# admin call such as api/pull which sends `name` - always goes to default_upstream,
# strict or not.
routing:
  strict: false
upstreams:
- name: ollama
  type: ollama
  base_url: http://host.docker.internal:11434
  models:
  - qwen3:4b
  - qwen3:8b
  - qwen3.6:35b-pruned
  - qwen3-reranker:4b-rk
  timeout: 600
  priority: 0
  vram_total_gb: 32.0
  description: 'Primary Ollama instance (GPU): keep the reranker here. qwen3-reranker:4b-rk is a num_ctx=8192 variant of qwen3-reranker:4b (see docs/Ranker.md) - same scores, ~4 GB VRAM instead of ~9.3 GB. vram_total_gb feeds the management console''s VRAM gauge (not discoverable over the API).'
- name: ollama-ipex-llm
  type: ollama
  base_url: http://host.docker.internal:11435
  models:
  - qwen3:4b
  timeout: 1800
  priority: 10
  vram_total_gb: 16.0
  description: 'Second Ollama instance (iGPU) - lower priority, used as fallback for overlapping models. Do NOT route the reranker here if this is the archived IPEX-LLM build (Ollama 0.9.3): it silently ignores ''logprobs''.'
- name: lmstudio
  type: lmstudio
  base_url: http://host.docker.internal:1234
  models: []
  # Display rename only: the model is unchanged, it is simply shown and called under this
  # short name. It does not add a model - for that, use the root `aliases` node below.
  model_aliases:
    qwen3.5:9b: qwen/qwen3.5-9b
  timeout: 600
  priority: 20
  description: LM Studio (OpenAI-compatible API); verbose model ids exposed under short names via model_aliases
- name: opencode
  type: opencode
  base_url: http://host.docker.internal:11430
  models:
  - auto
  - opencode/*
  timeout: 300
  priority: 30
  # Optional headers attached to every forwarded request. Model discovery (/v1/models,
  # /api/tags) and the /probe health checks send them too, so an upstream with its own
  # auth still shows up in the aggregated catalog. Never put a secret value here: name an
  # environment variable instead (websearch.api_key_env / systemone.api_key_env).
  # headers:
  #   Authorization: Bearer <provider key>
  description: 'OpenCode API Gateway: free built-in models (OpenAI-compatible chat) plus the web search provider used by POST /v1/tools/web-search. Set base_url to your gateway address; remove this upstream if you do not want it.'
# Must name an existing upstreams[].name. A dangling value silently disables the
# fallback: unroutable models and model-less calls (api/pull, api/blobs/*) then 404
# with "No upstream configured for model ''".
default_upstream: ollama
# Each entry below is a model of its own: `model` is what actually gets forwarded upstream,
# `params` are force-injected, and the console lists the alias as a separate row (its target
# stays callable under its own name). A pure display rename belongs in `model_aliases`.
aliases:
  qwen3:4b-nothink:
    model: qwen3:4b
    params:
      think: false
    description: 4B model with thinking disabled for faster responses
  qwen3.6:35b-nothink:
    model: qwen3.6:35b-pruned
    upstream: ollama
    params:
      think: false
    description: 35B pruned model with thinking disabled
num_ctx_overrides:
  qwen3.6:35b-pruned: 65536
  qwen3.5:9b: 16384
# Which models each API family may offer. The console's per-endpoint testers read this: a
# model that answers /api/embed must not appear in the chat selector, and nothing in
# `upstreams[].models` says which role a model plays. Every list is optional, and a name may
# be a real model id or any alias. Left empty, the choices are derived instead: `rerank`
# falls back to rerank.models, `systemone` to systemone.model, and the rest to every
# declared model minus the names another family claims (`generate` drops the embed, rerank
# and systemone names; a `websearch` claim does not count, because web search is a chat
# pass-through). The two Ollama-native testers (/api/generate, /api/embed) also drop models
# served by an lmstudio / opencode upstream, which only implements the /v1 side; the OpenAI
# compatible testers keep them. These lists only ever narrow what the selector shows.
# A NON-EMPTY list is a closed set: used exactly as written (blank `- ''` placeholders are
# ignored), with no provider-side narrowing and no 「Custom model…」 free-text entry. Only a
# family left empty gets those fallbacks. The same list feeds the page's "Available models"
# table and the model in its request/response examples.
api_models:
  generate: []
  embed: []
  rerank: []
  systemone: []
  websearch: []
rerank:
  enabled: true
  endpoint: /v1/rerank
  mode: logprobs
  models:
  - qwen3-reranker:4b
  instruction: Given a web search query, retrieve relevant passages that answer the query. A passage is relevant only if it directly answers the specific question asked. Passages that merely share the same broad topic, mention related keywords, or talk about the same field or entity without answering the question are NOT relevant.
  # The prompt each document is scored with. The built-in default is the official
  # Qwen3-Reranker chat template ({instruction} / {query} / {document}); override it only
  # for a reranker that expects a different phrasing, and keep the yes/no answer shape -
  # the score comes from the logprobs of the first answer token.
  # template: '<|im_start|>system\n...<|im_start|>assistant\n'
  yes_token: 'yes'
  no_token: 'no'
  yes_aliases: []
  no_aliases: []
  temperature: 0.0
  top_logprobs: 20
  max_tokens: 4
  token_scan_depth: 4
  stop: []
  options:
    num_ctx: 8192
  keep_alive: 3m
  logprobs_fallback: true
  fallback_yes: 0.9
  fallback_no: 0.1
  fallback_unknown: 0.0
  normalize: false
  max_concurrency: 8
  return_documents: true
  model_modes: {}
  upstream_api: auto
  raw_prompt: true
  disable_thinking: true
  max_documents: 0
  max_document_chars: 0
  on_error: score_zero
systemone:
  enabled: false
  backend: http://host.docker.internal:11435
  model: tev1
  api_key_env: SYSTEMONE_SERVER_API_KEY
  path: v1/systemone
  timeout: 60.0
websearch:
  enabled: false
  upstream: opencode
  path: v1/web-search
  api_key_env: ''
  timeout: 300.0
request_log:
  enabled: true